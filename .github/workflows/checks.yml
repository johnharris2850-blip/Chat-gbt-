name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source and generated assets
        run: |
          python3 tools/check_project.py
          python3 tools/generate_placeholder_assets.py --check
          tools/run_host_tests.sh

  gba-build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      BUTANO: ${{ github.workspace }}/external/butano
    steps:
      - uses: actions/checkout@v4
      - name: Configure devkitARM toolchain
        shell: bash
        run: |
          test -x "${DEVKITARM}/bin/arm-none-eabi-g++"
          echo "${DEVKITARM}/bin" >> "${GITHUB_PATH}"
          "${DEVKITARM}/bin/arm-none-eabi-g++" --version
      - name: Check out pinned Butano
        uses: actions/checkout@v4
        with:
          repository: GValiente/butano
          ref: "18.1.0"
          path: external/butano
          fetch-depth: 1
      - name: Verify pinned Butano checkout
        shell: bash
        run: |
          test "${BUTANO}" = "${GITHUB_WORKSPACE}/external/butano"
          test -d "${BUTANO}/.git"
          test -f "${BUTANO}/butano.mak"
          test "$(git -C "${BUTANO}" describe --tags --exact-match)" = "18.1.0"
          printf 'Butano checkout: %s\n' "${BUTANO}"
      - name: Build ROM
        shell: bash
        run: |
          command -v arm-none-eabi-g++
          tools/check_toolchain.sh
          make -j2
      - name: Record ROM
        run: |
          test -s crown_and_chaos.gba
          sha256sum crown_and_chaos.gba | tee crown_and_chaos.gba.sha256
          stat -c '%n %s bytes' crown_and_chaos.gba
      - uses: actions/upload-artifact@v4
        with:
          name: crown-and-chaos-gba-${{ github.sha }}
          path: |
            crown_and_chaos.gba
            crown_and_chaos.gba.sha256
          if-no-files-found: error
